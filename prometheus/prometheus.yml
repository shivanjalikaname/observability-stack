global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # --- the stack monitoring itself ---
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  # --- infrastructure ---
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          instance: docker-host

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  # --- applications ---
  # optional="true" keeps InstanceDown quiet when the demo profile isn't running
  - job_name: shortener
    static_configs:
      - targets: [shortener:8000]
        labels:
          service: url-shortener
          optional: "true"

  # --- synthetic checks via blackbox exporter ---
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://example.com
        labels:
          optional: "false"
      - targets:
          - http://shortener:8000/healthz
        labels:
          optional: "true"
    relabel_configs:
      # pass the target URL as ?target= and scrape the exporter instead
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
